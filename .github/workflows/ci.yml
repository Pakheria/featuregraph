name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q

  index-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: featuregraph scan --quiet
      - run: |
          python - <<'PY'
          import json, subprocess, sys
          for name in ("manifest.json", "index.json"):
              path = f".featuregraph/{name}"
              with open(path) as f:
                  current = json.load(f)
              committed = json.loads(subprocess.run(
                  ["git", "show", f"HEAD:{path}"], capture_output=True, text=True, check=True
              ).stdout)
              current["_meta"].pop("tree_hash", None)
              committed["_meta"].pop("tree_hash", None)
              if current != committed:
                  sys.exit(f"{path} differs from the committed scan")
          PY
      - run: git diff --exit-code -- .featuregraph/ ':!.featuregraph/manifest.json' ':!.featuregraph/index.json'
