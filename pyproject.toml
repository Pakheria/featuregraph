[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "featuregraph"
version = "0.1.0"
description = "Token-efficient, AST-indexed feature topology map for AI coding agents to eliminate AI amnesia."
readme = "README.md"
license = "MIT"
authors = [
    { name = "ProximaLink", email = "faizan@proximalink.pk" },
    { name = "Faizan Haroon", email = "faizanharoon@hotmail.com" }
]
keywords = [
    "ai", "llm", "context-window", "ast", "feature-graph",
    "code-indexing", "token-optimization", "agentic-ai",
    "antigravity", "claude-code", "cursor", "polyglot-ast"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Pakheria/featuregraph"
Repository = "https://github.com/Pakheria/featuregraph.git"
Issues = "https://github.com/Pakheria/featuregraph/issues"

[project.scripts]
featuregraph = "featuregraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["featuregraph"]
